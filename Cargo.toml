[workspace]
members = ["packages/*"]
resolver = "2"

[workspace.dependencies]
media-secret.path = "./packages/media-secret"
media-core.path = "./packages/media-core"

# WASM / browser
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
web-sys = "0.3"
js-sys = "0.3"
# reqwest = "0.13"

# Serialization (protocol)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cryptography
chacha20poly1305 = "0.10"
zstd = "0.13"
rand = "0.10"
