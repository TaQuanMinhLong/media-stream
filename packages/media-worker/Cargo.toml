[package]
name = "media-worker"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
media-core.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
console_error_panic_hook.workspace = true
js-sys.workspace = true

[dependencies.web-sys]
workspace = true
features = [
  "CodecState",
  "DedicatedWorkerGlobalScope",
  "EncodedVideoChunk",
  "EncodedVideoChunkInit",
  "EncodedVideoChunkType",
  "GpuBindGroup",
  "GpuBindGroupDescriptor",
  "GpuBindGroupEntry",
  "GpuBindGroupLayout",
  "GpuCanvasContext",
  "GpuCommandBuffer",
  "GpuCommandEncoder",
  "GpuDevice",
  "GpuExternalTexture",
  "GpuExternalTextureDescriptor",
  "GpuLoadOp",
  "GpuQueue",
  "GpuRenderPassColorAttachment",
  "GpuRenderPassDescriptor",
  "GpuRenderPassEncoder",
  "GpuRenderPipeline",
  "GpuSampler",
  "GpuStoreOp",
  "GpuTexture",
  "GpuTextureView",
  "Performance",
  "VideoDecoder",
  "VideoDecoderConfig",
  "VideoDecoderInit",
  "VideoFrame",
  "console",
]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
